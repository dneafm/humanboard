# Deploys the HumanBoard app from `main` to Cloud Run (`humanboard-app`).
#
# Secrets policy:
# - AI_API_KEY and GEMINI_API_KEY are sourced from this repository's GitHub
#   Actions secrets — they are NEVER hardcoded in this file. Any previous
#   hardcoded value in git history is invalidated at the provider.
# - See agentboard task `hb-rotate-exposed-ai-credential-20260609` for the
#   rotation and the operator handoff context.
# - To rotate AI_API_KEY: update the GitHub repo secret, then trigger a new
#   deploy; the next Cloud Run revision will pick up the new value at build
#   time. The previous revision keeps the old env until traffic shifts.

name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: project-93d3d45f-1909-4214-af4
  REGION: us-central1
  SERVICE_NAME: humanboard-app
  BUCKET_NAME: humanboardapp-storage

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/645061671428/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@project-93d3d45f-1909-4214-af4.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate deployment secrets
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          test -n "$AI_API_KEY" || { echo "::error::Missing AI_API_KEY repository secret"; exit 1; }

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          docker build -t us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/humanboard/app:latest .
          docker push us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/humanboard/app:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/humanboard/app:latest \
            --port 8080 \
            --region ${{ env.REGION }} \
            --max-instances 1 \
            --allow-unauthenticated \
            --add-volume=name=storage-volume,type=cloud-storage,bucket=${{ env.BUCKET_NAME }} \
            --add-volume-mount=volume=storage-volume,mount-path=/app/data \
            --set-env-vars="^|^GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}|IMAGE_GENERATOR_BACKEND=recraft|AI_BASE_URL=https://www.surplusintelligence.ai/api/inference/v1|AI_API_KEY=${{ secrets.AI_API_KEY }}|AI_FALLBACK_MODEL=gemini-3-flash-preview|AI_DAILY_REQUEST_LIMIT=1000|HUMANBOARD_OWNER_ID=SITMhQ5Y4kdgbh4v6PxfFWq1XJR2,CKFW7EfrIMR4nvWkhVrQUgpY35I3"
