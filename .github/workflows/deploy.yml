name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: project-93d3d45f-1909-4214-af4
  REGION: us-central1
  SERVICE_NAME: humanboard-app
  BUCKET_NAME: humanboardapp-storage

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          docker build -t us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/humanboard/app:latest .
          docker push us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/humanboard/app:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/humanboard/app:latest \
            --port 8080 \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --add-volume=name=storage-volume,type=cloud-storage,bucket=${{ env.BUCKET_NAME }} \
            --add-volume-mount=volume=storage-volume,mount-path=/app/data \
            --set-env-vars="GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},IMAGE_GENERATOR_BACKEND=recraft"
